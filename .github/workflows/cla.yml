name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# permite que o bot comente, marque status e grave o arquivo de assinaturas no repo
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/eruptionlabs/eruption-engine/blob/main/CONTRIBUTING.md"
          branch: "main"
          allowlist: bot*
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: |
            Obrigado pela contribuição! Antes de revisarmos este PR, você precisa concordar com o
            Contributor License Agreement (CLA) descrito em [CONTRIBUTING.md](https://github.com/eruptionlabs/eruption-engine/blob/main/CONTRIBUTING.md#1-termo-de-contribuição-cla).

            Para assinar, comente neste PR exatamente:

            > I have read the CLA Document and I hereby sign the CLA
